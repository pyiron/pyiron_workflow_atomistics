channels:
  - conda-forge

dependencies:
  # Core Python version
  - python =3.11
  - pip

  # Conda-forge packages
  - ase =3.24.0 # structuretoolkit 0.0.48 requires ase>=3.24.0
  - flowrep =0.6.0
  - matplotlib-base =3.1.0 # conda name; the release script maps matplotlib -> matplotlib-base
  - numpy =1.23.5 # structuretoolkit 0.0.48 requires numpy>=1.23.5
  - pandas =1.3.0
  - pyiron_workflow =0.19.0
  - pyiron_snippets =1.3.0
  - pymatgen =2024.8.8
  - pyscal3 =4.1.0 # structure/defects.py uses the pyscal3 4 API (no System class)
  - scikit-learn =1.0.0
  - structuretoolkit =0.0.48
  - tqdm =4.68.0

  # Test runners / notebook execution
  - pytest
  - nbformat
  - nbclient

  # PyPI-only deps (not on conda-forge)
  - pip:
    - lz-GB-code==0.1.0
