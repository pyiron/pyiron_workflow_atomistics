channels:
  - conda-forge

dependencies:
  # Core Python version
  - python =3.11
  - pip

  # Conda-forge packages
  - ase =3.21.0
  - flowrep =0.6.0
  - matplotlib =3.1.0
  - numpy =1.22.0
  - pandas =1.3.0
  - pyiron_workflow =0.19.0
  - pyiron_snippets =1.3.0
  - pymatgen =2024.8.8
  - pyscal3 =3.3.2
  - scikit-learn =1.0.0
  - structuretoolkit =0.0.45
  - tqdm =4.68.0

  # Test runners / notebook execution
  - pytest
  - nbformat
  - nbclient

  # PyPI-only deps (not on conda-forge)
  - pip:
    - lz-GB-code==0.1.0
