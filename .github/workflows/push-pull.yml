# This runs jobs which pyiron modules should run on pushes or PRs to main

name: Push-Pull

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  pyiron:
    uses: pyiron/actions/.github/workflows/push-pull.yml@actions-4.2.1
    with:
      notebooks-env-files: .ci_support/environment.yml .ci_support/environment-binder.yml
      runner: 'ubuntu-22.04' # with ubuntu > 22.04, pip is broken
      python-version: '3.12'
      python-version-alt1: '3.13'
      python-version-alt2: '3.11'
      python-version-alt3: '3.14'
      runner-alt1: 'exclude'
      # The upstream coverage job runs `unittest discover`, which silently
      # skips every pytest-style test in this repo. We run our own pytest
      # coverage job below instead.
      do-coveralls: false
    secrets: inherit

  uv_check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        # versioneer derives the version from git tags; without them the
        # project is 0.post0.dev1 and pyiron_workflow_lammps ([free-energy]),
        # which needs pyiron-workflow-atomistics>=0.2.2, cannot be resolved
        fetch-depth: 0
    - uses: astral-sh/setup-uv@v7
    - name: Install the project and pip check
      shell: bash -l {0}
      run: |
        uv sync --all-extras --dev
        pip check

  pytest-coverage:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pyiron/actions/cached-miniforge@actions-4.2.1
        with:
          python-version: '3.12'
          env-files: .ci_support/environment.yml
      - name: Run pytest with coverage
        shell: bash -l {0}
        run: |
          pytest tests/unit tests/integration/test_gb_code_pipeline.py \
            --cov=pyiron_workflow_atomistics \
            --cov-report=xml \
            --cov-report=term
      - name: Coveralls
        uses: coverallsapp/github-action@v2
        with:
          file: coverage.xml

  # The calphy adapter against real calphy and LAMMPS. The other jobs have
  # neither, so the free-energy tests that need them skip there.
  free-energy:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # versioneer derives the version from git tags
      - uses: pyiron/actions/cached-miniforge@actions-4.2.1
        with:
          python-version: '3.12'
          env-files: .ci_support/environment.yml .ci_support/environment-free-energy.yml
      - name: Install calphy and pyiron_workflow_lammps
        shell: bash -l {0}
        run: |
          pip install calphy==2.3.0 pyiron_workflow_lammps==0.2.0
          pip check
          which lmp
      - name: Run the free-energy tests (none may skip)
        shell: bash -l {0}
        run: |
          set -euo pipefail
          pytest tests/unit/physics/test_free_energy.py -rs | tee pytest.log
          if grep -q SKIPPED pytest.log; then
            echo "::error::free-energy tests were skipped"
            exit 1
          fi
