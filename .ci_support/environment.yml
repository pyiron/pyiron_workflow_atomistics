channels:
  - conda-forge

dependencies:
  # Build dependency
  - pip
  - setuptools

  # Conda-forge packages
  - ase =3.29.0
  - flowrep =0.6.7
  - matplotlib =3.11.2
  - numpy =2.4.6
  - pandas =3.0.5
  - pyiron_workflow =0.20.3
  - pyiron_snippets =1.4.0
  - pymatgen =2026.9.24
  - pyscal3 =3.3.2 # used by structure/defects.py void-analysis helpers (Tier 2 tests)
  - scikit-learn =1.9.0
  - scipy =1.17.1
  - structuretoolkit =0.0.47 # CNA + Voronoi descriptors for analysis/ + physics/melting/
  - tqdm =4.70.0

  # Test runners / notebook execution
  - pytest
  - pytest-cov
  - nbformat
  - nbclient

  # Optional [phonons] / [phonons-md] extras — needed for the phono3py and
  # dynaphopy example notebooks plus their integration tests.
  - phonopy
  - phono3py
  - symfc
  - dynaphopy

  # PyPI-only deps (not on conda-forge)
  - pip:
    - lz-GB-code==0.1.0
