# This runs jobs which pyiron modules should run on release
name: Release

on:
  pull_request:
  release:
    types: [ published ]

jobs:
  pyiron:
    uses: ./.github/workflows/pyproject-release.yml
    secrets: inherit
    with:
      semantic-upper-bound: 'minor'
      lower-bound-yaml: '.ci_support/lower-bound.yml'
      upper-bound-yaml: '.ci_support/upper-bound.yml'
      pypi-to-conda-name-map-file: '.github/actions/.support/pypi_vs_conda_names.json'
      publish-to-pypi: ${{ github.event_name == 'release' && github.event.action == 'published' }}
