# Added to environment.yml by the free-energy job in push-pull.yml, which runs
# the calphy adapter against real calphy and LAMMPS. calphy itself and
# pyiron_workflow_lammps are pip-installed by that job: conda-forge's calphy
# 2.3.0 mislabels its licence (GPL-2.0-only; it is the Academic Software
# Licence v1.0) and pulls in MPI. Builds 4-6 of lammps 2025.07.22 ship a
# liblammps.so needing GLIBC_2.38 although their metadata says >=2.17;
# build 2 runs on ubuntu-22.04 (glibc 2.35).
channels:
  - conda-forge

dependencies:
  - lammps =2025.07.22=*nompi_2
