channels:
  - conda-forge

dependencies:
  # Build dependency
  - pip
  - setuptools

  # Conda-forge packages
  - ase =3.29.0
  - flowrep =0.6.7
  - matplotlib =3.11.2
  - numpy =2.4.6
  - pandas =3.0.6
  - pyiron_snippets =1.5.0
  - pyiron_workflow =0.20.3
  - pymatgen =2026.9.24
  - scipy =1.17.1

  # Optional [analysis] extra: CNA + Voronoi descriptors for analysis/ and
  # physics/melting/ (structuretoolkit, scikit-learn), and the
  # structure/defects.py void analysis (pyscal3). Not required by the
  # package, but CI tests the full functionality.
  - pyscal3 =4.1.0
  - scikit-learn =1.9.1
  - structuretoolkit =0.0.48
  # Optional [gb] extra: progress bars for the GB CSL search.
  - tqdm =4.70.1

  # Test runners / notebook execution
  - pytest
  - pytest-cov
  - nbformat
  - nbclient

  # Optional [phonons] / [phonons-md] extras — needed for the phono3py and
  # dynaphopy example notebooks plus their integration tests.
  - phonopy
  - phono3py
  - symfc
  - dynaphopy

  # PyPI-only deps (not on conda-forge)
  - pip:
    - lz-GB-code==0.1.0
